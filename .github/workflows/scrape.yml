name: Update LEGO dashboard

on:
  schedule:
    # Twice daily, matching the local schedule: 6am/6pm US Eastern.
    # GitHub Actions cron is UTC and doesn't shift for daylight saving, so
    # this is 10:00/22:00 UTC (EDT, UTC-4) and will run an hour off during
    # EST (UTC-5) in winter — not worth a DST-aware cron for a personal
    # dashboard refresh.
    - cron: "0 10 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    # Runs on the Mac itself (registered as a self-hosted runner), not
    # GitHub's shared runners — LEGO.com's Cloudflare protection blocks
    # GitHub's runner IP ranges outright (confirmed: every request 403'd,
    # including just fetching the sitemap), while it's fine from a
    # residential IP. BrickRanker/Brickset/Brick Fanatics work from either.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - run: '"/Users/brendannussenblatt/Lego Retirement Agent/.venv/bin/pip" install -r requirements.txt'

      # Fast no-op if the browser is already cached (it is, after the
      # first run) — kept here so a fresh/reset runner stays self-healing.
      - run: '"/Users/brendannussenblatt/Lego Retirement Agent/.venv/bin/playwright" install chromium'

      - run: '"/Users/brendannussenblatt/Lego Retirement Agent/.venv/bin/python3" run_all.py'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Commit updated data and dashboard
        run: |
          git config user.name "lego-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/
          git diff --cached --quiet || git commit -m "Automated data refresh"
          git fetch origin main
          # data/ and site/ are fully regenerated every run, so on conflict
          # this run's fresh scrape always wins over whatever else pushed
          # to main in the meantime (e.g. a manual push mid-run).
          git merge -X ours --no-edit origin/main
          git push

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 7cddcdf1-067d-4ee7-bbdd-22e03667bed7
        run: /opt/homebrew/bin/netlify deploy --prod --dir=site
